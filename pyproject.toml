[project]
name = "box"
version = "0.1.0"
description = "Command-line tool for the company-in-a-box repository"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
box = "box.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine/cli"]
include = ["box*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
